# lean-prime configuration
#
# Location: ~/.config/lean-prime/config.toml   (or pass --config <path>)
#
# Precedence, later winning:
#   built-in defaults → this file → environment variables → command line flags
#
# NEVER put an API key in this file. Only the NAME of the environment
# variable holding it belongs here.

[provider]
kind              = "openai-compatible"
base_url          = "https://router.kiosapi.com/v1"
model             = "oc/muse-spark-1.3-contributor"
api_key_env       = "LEANPRIME_API_KEY"

# Reasoning models spend a large share of the completion budget on thinking
# that the router may not forward. Too low a value shows up as an empty reply
# with finish_reason "length".
max_tokens        = 200000
temperature       = 0.2
stream            = true

timeout_sec       = 180
connect_timeout_sec = 20
max_retries       = 4

# Pace outbound requests so a per-minute provider cap is not tripped.
# 6500ms keeps a 10-requests-per-minute limit comfortably satisfied.
min_interval_ms   = 6500

# extra_headers = ["X-Title: lean-prime"]

[prompt]
# YOUR instructions outrank LeanPrime's built-in ones. See Docs/system-prompt.md
#
# mode:
#   replace — your text IS the system prompt; the built-in method is dropped
#   prepend — yours first, then the built-in method (default)
#   append  — built-in method first, then yours
mode              = "prepend"

# Inline, or point at a file. A file is usually easier to maintain.
# system          = "Always write the test before the implementation."
# system_file     = "~/my-agent-rules.md"

# Workspace files consulted for project-level instructions, first match wins.
project_files     = ["LEANPRIME.md", "AGENTS.md", "CLAUDE.md", ".leanprime/system.md"]

# Re-assert your rules every N model calls. This is what keeps a long run on
# instruction: by iteration fifteen the original prompt is far behind a wall of
# tool output and is competing with it for attention. 0 disables.
reminder_every    = 3

# Parse imperative rules out of your prompt and restate them as a checklist.
extract_directives = true

# Before finishing, require the model to account for each rule.
adherence_check   = true

[agent]
# auto      — safe work runs unattended, risky work asks
# ask       — every mutating action asks
# read-only — inspection only; mutating tools are not advertised to the model
# yolo      — no prompting (the deny list still applies)
approval_mode     = "auto"

max_iterations    = 40
max_tool_calls    = 120
max_repair_rounds = 5
wall_clock_sec    = 1800
context_budget    = 1000000
persist_sessions  = true

[limits]
# Applied to every tool result before it may enter the model's context.
max_output_bytes  = 32768
head_lines        = 120
tail_lines        = 60
max_file_bytes    = 262144

[security]
# Mark file contents and command output as data rather than instruction.
# Off by default: the agent follows instructions wherever it finds them,
# including in the repository it is working on. Turn it on when pointing the
# agent at a codebase you did not write. Either way the permission engine
# still rules on every action.
data_fencing      = false

# Refused outright in every approval mode, matched on the command's first word.
denied_commands   = ["shutdown", "reboot", "halt", "poweroff", "mkfs",
                     "fdisk", "dd", "sudo", "su", "doas"]
shell_timeout_sec = 120

[logging]
level             = "info"     # trace | debug | info | warn | error
trace             = false
# file            = "/tmp/lean-prime.log"

[ui]
color             = true
show_plan         = true
show_thinking     = true
compact           = false

# MCP servers are parsed but not yet used — see Docs/mcp.md
# [[mcp]]
# name    = "example"
# command = "example-mcp-server"
# args    = ["--stdio"]
# enabled = true
